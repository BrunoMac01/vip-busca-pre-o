<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP CELL — Consulta de Preços</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:#3f9a2a;
    --green:#6cc24a;
    --green-light:#9fe07a;
    --green-tint:#1c2b16;
    --ink:#eef2ea;
    --slate:#98a091;
    --line:#333a2e;
    --paper:#14170f;
    --panel:#1b1f16;
    --white:#eef2ea;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }

  .bg-grid{
    position:fixed;
    inset:0;
    z-index:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:34px 34px;
    -webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 0%, black 0%, transparent 75%);
    mask-image:radial-gradient(ellipse 70% 55% at 50% 0%, black 0%, transparent 75%);
    opacity:0.35;
    pointer-events:none;
  }

  .app{
    position:relative;
    z-index:1;
    width:100%;
    max-width:520px;
    padding:40px 22px 100px;
  }

  header{
    text-align:center;
    margin-bottom:28px;
  }
  header img{
    width:min(78%, 320px);
    height:auto;
    display:block;
    margin:0 auto 6px;
  }
  header p{
    margin:0;
    color:var(--slate);
    font-size:14px;
    letter-spacing:0.01em;
  }

  .search-wrap{
    position:relative;
    margin-bottom:8px;
  }
  .search-wrap input{
    width:100%;
    padding:16px 52px 16px 20px;
    border-radius:14px;
    border:1.5px solid var(--line);
    background:var(--panel);
    font-family:'Inter',sans-serif;
    font-size:16px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .search-wrap input:focus{
    border-color:var(--green);
    box-shadow:0 0 0 3px var(--green-tint);
  }
  .search-wrap button{
    position:absolute;
    right:6px;
    top:6px;
    bottom:6px;
    width:44px;
    border:none;
    border-radius:10px;
    background:var(--green);
    color:var(--white);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s ease;
  }
  .search-wrap button:hover{background:var(--green-deep);}
  .search-wrap svg{width:19px;height:19px;}

  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin:26px 2px 10px;
  }
  .meta-row h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:16px;
    font-weight:600;
    margin:0;
  }
  .meta-row span{
    font-size:12.5px;
    color:var(--slate);
  }

  .results{
    display:flex;
    flex-direction:column;
  }
  .item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 2px;
    border-bottom:1px solid var(--line);
    gap:10px;
  }
  .item:first-child{border-top:1px solid var(--line);}
  .item-price-block{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .item-actions{
    display:flex;
    gap:2px;
  }
  .item-actions button{
    width:30px;
    height:30px;
    border:none;
    background:transparent;
    color:var(--slate);
    border-radius:8px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s ease, color .15s ease;
  }
  .item-actions button svg{width:15px;height:15px;}
  .item-actions .edit-btn:hover{background:var(--green-tint); color:var(--green-light);}
  .item-actions .delete-btn:hover{background:#3a1a17; color:#e2685c;}
  .item-name{
    font-size:15px;
    font-weight:500;
    color:var(--ink);
    margin:0 0 4px;
  }
  .item-sub{
    font-size:12.5px;
    color:var(--slate);
    margin:0;
  }
  .item-price{
    font-family:'Space Grotesk',sans-serif;
    font-size:19px;
    font-weight:700;
    color:var(--green-light);
    white-space:nowrap;
  }

  .empty{
    text-align:center;
    padding:34px 10px;
    color:var(--slate);
    font-size:14px;
    display:none;
  }

  .fab{
    position:fixed;
    right:24px;
    bottom:24px;
    width:56px;
    height:56px;
    border-radius:50%;
    background:var(--green);
    color:var(--paper);
    border:none;
    font-size:28px;
    line-height:1;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,0.22);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:5;
    transition:transform .15s ease, background .15s ease;
  }
  .fab:hover{background:var(--green-deep); transform:translateY(-1px);}

  .sheet-backdrop{
    position:fixed;
    inset:0;
    background:rgba(20,22,17,0.42);
    z-index:9;
    display:none;
    align-items:flex-end;
    justify-content:center;
  }
  .sheet-backdrop.open{display:flex;}
  .sheet{
    background:var(--panel);
    width:100%;
    max-width:520px;
    border-radius:20px 20px 0 0;
    padding:22px 22px 26px;
    box-shadow:0 -10px 30px rgba(0,0,0,0.18);
  }
  .sheet h3{
    font-family:'Space Grotesk',sans-serif;
    font-size:17px;
    margin:0 0 16px;
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:12.5px;
    color:var(--slate);
    margin-bottom:5px;
  }
  .field input{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:15px;
    outline:none;
  }
  .field input:focus{border-color:var(--green);}
  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:16px;
  }
  .sheet-actions button{
    flex:1;
    padding:13px;
    border-radius:10px;
    border:none;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-cancel{background:var(--paper); color:var(--slate); border:1.5px solid var(--line) !important;}
  .btn-save{background:var(--green); color:var(--white);}
  .btn-save:hover{background:var(--green-deep);}
</style>
</head>

  <div class="search-wrap">

<button class="fab" id="addBtn" aria-label="Cadastrar preço">+</button>

<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet">
    <h3>Cadastrar preço</h3>
    <div class="field">
      <label for="fProduto">Produto</label>
      <input id="fProduto" type="text" placeholder="Ex: Capinha iPhone 13">
    </div>
    <div class="field">
      <label for="fPreco">Preço (R$)</label>
      <input id="fPreco" type="number" step="0.01" placeholder="Ex: 39.90">
    </div>
    <div class="field">
      <label for="fLoja">Loja / cidade</label>
      <input id="fLoja" type="text" placeholder="Ex: VIP CELL - Simão Dias">
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="cancelBtn">Cancelar</button>
      <button class="btn-save" id="saveBtn">Salvar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== CONFIGURAÇÃO DO SUPABASE ======
// Troque pelos valores do SEU projeto (Settings → API no painel do Supabase)
const SUPABASE_URL = 'https://tqpitgktxxjbzfkyjdut.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_nnx4sYbcOU_tr7lbhC_E-w_eVbvw7yb';
const supabaseClient = (SUPABASE_URL.startsWith('http'))
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;
// =======================================

let entries = [];

const resultsEl = document.getElementById('results');
const emptyMsg = document.getElementById('emptyMsg');
const resultsCount = document.getElementById('resultsCount');
const resultsTitle = document.getElementById('resultsTitle');
const searchInput = document.getElementById('searchInput');
const configWarning = document.getElementById('configWarning');

function formatBRL(v){
  return v.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}

function formatDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR');
}

async function loadEntries(){
  if(!supabaseClient){
    configWarning.style.display = 'block';
    resultsCount.textContent = '';
    return;
  }
  const { data, error } = await supabaseClient
    .from('precos')
    .select('*')
    .order('created_at', { ascending: false });

  if(error){
    console.error('Erro ao carregar preços:', error);
    resultsCount.textContent = 'erro ao carregar';
    alert('Erro ao carregar: ' + (error.message || JSON.stringify(error)));
    return;
  }
  entries = data.map(row => ({
    id: row.id,
    produto: row.produto,
    preco: row.preco,
    loja: row.loja,
    data: formatDate(row.created_at)
  }));
  render('');
}

function render(filter){
  const term = (filter || '').trim().toLowerCase();
  const withIndex = entries.map((entry, index) => ({entry, index}));
  const filtered = term
    ? withIndex.filter(({entry}) => entry.produto.toLowerCase().includes(term))
    : withIndex;

  resultsTitle.textContent = term ? `Resultados para "${filter}"` : 'Preços cadastrados';
  resultsCount.textContent = filtered.length + (filtered.length === 1 ? ' item' : ' itens');

  resultsEl.innerHTML = '';
  if(filtered.length === 0){
    emptyMsg.style.display = 'block';
    return;
  }
  emptyMsg.style.display = 'none';

  filtered
    .forEach(({entry, index}) => {
      const row = document.createElement('div');
      row.className = 'item';
      row.innerHTML = `
        <div>
          <p class="item-name">${entry.produto}</p>
          <p class="item-sub">${entry.loja} · ${entry.data}</p>
        </div>
        <div class="item-price-block">
          <div class="item-price">${formatBRL(entry.preco)}</div>
          <div class="item-actions">
            <button class="edit-btn" aria-label="Editar" data-index="${index}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button class="delete-btn" aria-label="Excluir" data-index="${index}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
            </button>
          </div>
        </div>
      `;
      resultsEl.appendChild(row);
    });

  resultsEl.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => openEditSheet(parseInt(btn.dataset.index, 10)));
  });
  resultsEl.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', () => deleteEntry(parseInt(btn.dataset.index, 10)));
  });
}

searchInput.addEventListener('input', () => render(searchInput.value));

// Cadastro / edição (sheet)
let editIndex = null;
const sheetBackdrop = document.getElementById('sheetBackdrop');
const sheetTitle = document.querySelector('.sheet h3');

document.getElementById('addBtn').addEventListener('click', () => {
  editIndex = null;
  sheetTitle.textContent = 'Cadastrar preço';
  document.getElementById('saveBtn').textContent = 'Salvar';
  sheetBackdrop.classList.add('open');
});

function openEditSheet(index){
  editIndex = index;
  const e = entries[index];
  document.getElementById('fProduto').value = e.produto;
  document.getElementById('fPreco').value = e.preco;
  document.getElementById('fLoja').value = e.loja;
  sheetTitle.textContent = 'Editar preço';
  document.getElementById('saveBtn').textContent = 'Atualizar';
  sheetBackdrop.classList.add('open');
}

async function deleteEntry(index){
  const e = entries[index];
  if(!confirm(`Excluir "${e.produto}" (${formatBRL(e.preco)})?`)) return;
  const { error } = await supabaseClient.from('precos').delete().eq('id', e.id);
  if(error){ console.error('Erro ao excluir:', error); return; }
  await loadEntries();
  render(searchInput.value);
}

document.getElementById('cancelBtn').addEventListener('click', closeSheet);
sheetBackdrop.addEventListener('click', (ev) => {
  if(ev.target === sheetBackdrop) closeSheet();
});
function closeSheet(){
  sheetBackdrop.classList.remove('open');
  editIndex = null;
  document.getElementById('fProduto').value = '';
  document.getElementById('fPreco').value = '';
  document.getElementById('fLoja').value = '';
}

document.getElementById('saveBtn').addEventListener('click', async () => {
  const produto = document.getElementById('fProduto').value.trim();
  const preco = parseFloat(document.getElementById('fPreco').value);
  const loja = document.getElementById('fLoja').value.trim();
  if(!produto || isNaN(preco) || !loja){
    return;
  }
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Salvando...';

  let error;
  if(editIndex !== null){
    const id = entries[editIndex].id;
    ({ error } = await supabaseClient.from('precos').update({ produto, preco, loja }).eq('id', id));
  } else {
    ({ error } = await supabaseClient.from('precos').insert({ produto, preco, loja }));
  }

  if(error){
    console.error('Erro ao salvar:', error);
    saveBtn.disabled = false;
    saveBtn.textContent = editIndex !== null ? 'Atualizar' : 'Salvar';
    alert('Erro ao salvar: ' + (error.message || JSON.stringify(error)));
    return;
  }

  await loadEntries();

  saveBtn.disabled = false;
  saveBtn.textContent = editIndex !== null ? 'Atualizar' : 'Salvar';
  closeSheet();
  render(searchInput.value);
});

loadEntries();
</script>

</body>
</html>
